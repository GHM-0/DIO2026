# docker-compose.yml
services:
  db:
    profiles: ["dev-db","deploy"]
    image: docker.io/library/mysql:8.4.4
    container_name: ${DB_CONTAINER}
    user: "999:999"
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
#      - SETGID
#      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    command:
      - mysqld
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
      #- "${MYSQL_PORTX}:33060"        -> para o profile Dev apenas
    volumes:
        # Camada de dados da instância
        - ./.db/mysql:/var/lib/mysql:Z
        - ./mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:Z
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app:
    profiles: ["dev-app","deploy"]
    build: .
    image: ${APP_IMAGE}:${APP_VERSION}
    container_name: ${APP_CONTAINER}
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    depends_on:
      db:
        condition: service_healthy
    command: ["--host", "0.0.0.0", "--port", "8000"]
    environment:
      - MYSQL_HOST=db
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    ports:
      - "${APP_PORT}:8000"
    networks:
      - backend

networks:
  backend:
    driver: bridge
