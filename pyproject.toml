[project]
name = "desafio"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.18.4",
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "pymysql>=1.1.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
]

[mypy]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
